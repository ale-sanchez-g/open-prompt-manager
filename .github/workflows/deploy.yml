name: Deploy

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      rollback_to_tag:
        description: >-
          Rollback runbook: set to a previously deployed tag (e.g. v1.4.2) to
          point the running services back at that tag's already-published,
          already-scanned images. Required to run this workflow manually —
          there is no "normal manual deploy" path, only rollback.
        required: true
        type: string

permissions: {}  # Deny all at workflow level — each job opts in explicitly

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: deploy-${{ github.ref_name }}-${{ github.event.inputs.rollback_to_tag || 'deploy' }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Gate: require CI to have passed for the commit being deployed before any
  # build/push/apply work starts. Only applies to the tag-push deploy path —
  # rollback redeploys a tag that was already gated and deployed previously.
  #
  # Check runs from `pull_request`-triggered CI attach to the PR head SHA, not
  # to the squash-merge commit later created on main by release-tag.yml. So we
  # look up check runs for this exact commit first, and fall back to the merged
  # pull request associated with it (the standard way GitHub itself resolves
  # "did CI pass for this commit" for merge commits).
  # ─────────────────────────────────────────────────────────────────────────────
  ci-gate:
    name: Verify CI Passed
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read

    steps:
      - name: Require a successful CI run for this commit
        uses: actions/github-script@v9
        with:
          script: |
            const sha = context.sha;
            const { owner, repo } = context.repo;

            async function checkRunsFor(ref) {
              return github.paginate(github.rest.checks.listForRef, {
                owner, repo, ref, per_page: 100,
              });
            }

            let checkRuns = await checkRunsFor(sha);
            let source = `commit ${sha}`;

            if (checkRuns.length === 0) {
              const prs = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                { owner, repo, commit_sha: sha, per_page: 100 }
              );
              const mergedPr = prs.find((pr) => pr.merged_at);
              if (mergedPr) {
                checkRuns = await checkRunsFor(mergedPr.head.sha);
                source = `PR #${mergedPr.number} head commit ${mergedPr.head.sha}`;
              }
            }

            if (checkRuns.length === 0) {
              core.setFailed(
                `No CI check runs found for ${source}. Refusing to deploy without verified CI status.`
              );
              return;
            }

            // This very workflow (Deploy) is itself running against `sha` right now,
            // so its own jobs show up as in-progress/queued check runs on this commit.
            // Exclude them by name so we only gate on the separate CI workflow's checks.
            const ownJobNames = new Set([
              'Verify CI Passed',
              'Build, Scan, Push, and Terraform Apply',
              'Rollback — Redeploy Previous Tag',
            ]);
            const relevant = checkRuns.filter((run) => !ownJobNames.has(run.name));

            const incomplete = relevant.filter((run) => run.status !== 'completed');
            if (incomplete.length > 0) {
              core.setFailed(
                `CI checks still in progress for ${source}: ${incomplete.map((r) => r.name).join(', ')}`
              );
              return;
            }

            const acceptable = new Set(['success', 'skipped', 'neutral']);
            const failed = relevant.filter((run) => !acceptable.has(run.conclusion));
            if (failed.length > 0) {
              core.setFailed(
                `CI did not pass for ${source}: ${failed.map((r) => `${r.name} (${r.conclusion})`).join(', ')}`
              );
              return;
            }

            core.info(`CI gate passed — ${relevant.length} check run(s) succeeded for ${source}.`);

  deploy:
    name: Build, Scan, Push, and Terraform Apply
    needs: ci-gate
    # Custom `if:` conditions replace the implicit success() check on `needs`,
    # so success() is spelled out explicitly here — otherwise this job would
    # still run on a tag push even if the ci-gate job above failed.
    if: github.event_name == 'push' && success()
    runs-on: ubuntu-latest
    # Requires a `prod` GitHub Environment to exist in this repository with
    # required reviewers configured (Settings > Environments > prod >
    # Deployment protection rules). That approval gate cannot be set from
    # workflow YAML — it must be configured once by a repo admin.
    environment:
      name: prod
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve deploy configuration
        id: config
        run: |
          set -euo pipefail
          AWS_REGION="${AWS_REGION:-ap-southeast-2}"
          PROJECT_NAME="${PROJECT_NAME:-open-prompt-manager}"
          ENVIRONMENT="${ENVIRONMENT:-prod}"
          echo "aws_region=${AWS_REGION}" >> "$GITHUB_OUTPUT"
          echo "project_name=${PROJECT_NAME}" >> "$GITHUB_OUTPUT"
          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "tf_workspace=${PROJECT_NAME}-${ENVIRONMENT}-${AWS_REGION}" >> "$GITHUB_OUTPUT"
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ steps.config.outputs.aws_region }}
          role-session-name: github-actions-deploy

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.7.5'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve AWS account ID
        id: aws-account
        run: |
          set -euo pipefail
          echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Bootstrap ECR repositories with Terraform
        id: ecr
        working-directory: terraform
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure
          terraform workspace select "${TF_WORKSPACE}" || terraform workspace new "${TF_WORKSPACE}"

          terraform apply -auto-approve \
            -target=aws_ecr_repository.backend \
            -target=aws_ecr_repository.frontend \
            -var="aws_region=${AWS_REGION}" \
            -var="project_name=${PROJECT_NAME}" \
            -var="environment=${ENVIRONMENT}"

          echo "backend_repo=$(terraform output -raw backend_ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "frontend_repo=$(terraform output -raw frontend_ecr_repository_url)" >> "$GITHUB_OUTPUT"
        env:
          AWS_REGION: ${{ steps.config.outputs.aws_region }}
          PROJECT_NAME: ${{ steps.config.outputs.project_name }}
          ENVIRONMENT: ${{ steps.config.outputs.environment }}
          TF_WORKSPACE: ${{ steps.config.outputs.tf_workspace }}

      - name: Authenticate Docker to ECR
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin \
                "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
        env:
          AWS_REGION: ${{ steps.config.outputs.aws_region }}
          AWS_ACCOUNT_ID: ${{ steps.aws-account.outputs.id }}

      - name: Install Trivy vulnerability scanner
        run: |
          set -euo pipefail
          curl -fsSL https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy
          trivy --version

      - name: Build backend image (local only — scanned before push)
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 \
            -t "${BACKEND_REPO}:${DEPLOY_TAG}" \
            -t "${BACKEND_REPO}:latest" \
            ./backend \
            --load
        env:
          BACKEND_REPO: ${{ steps.ecr.outputs.backend_repo }}
          DEPLOY_TAG: ${{ github.ref_name }}

      - name: Scan backend image for HIGH/CRITICAL vulnerabilities (Trivy)
        run: |
          set -euo pipefail
          trivy image \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table \
            "${BACKEND_REPO}:${DEPLOY_TAG}"
        env:
          BACKEND_REPO: ${{ steps.ecr.outputs.backend_repo }}
          DEPLOY_TAG: ${{ github.ref_name }}

      - name: Push backend image
        run: |
          set -euo pipefail
          docker push "${BACKEND_REPO}:${DEPLOY_TAG}"
          docker push "${BACKEND_REPO}:latest"
        env:
          BACKEND_REPO: ${{ steps.ecr.outputs.backend_repo }}
          DEPLOY_TAG: ${{ github.ref_name }}

      - name: Build frontend image (local only — scanned before push)
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 \
            -t "${FRONTEND_REPO}:${DEPLOY_TAG}" \
            -t "${FRONTEND_REPO}:latest" \
            ./frontend \
            --load
        env:
          FRONTEND_REPO: ${{ steps.ecr.outputs.frontend_repo }}
          DEPLOY_TAG: ${{ github.ref_name }}

      - name: Scan frontend image for HIGH/CRITICAL vulnerabilities (Trivy)
        run: |
          set -euo pipefail
          trivy image \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table \
            "${FRONTEND_REPO}:${DEPLOY_TAG}"
        env:
          FRONTEND_REPO: ${{ steps.ecr.outputs.frontend_repo }}
          DEPLOY_TAG: ${{ github.ref_name }}

      - name: Push frontend image
        run: |
          set -euo pipefail
          docker push "${FRONTEND_REPO}:${DEPLOY_TAG}"
          docker push "${FRONTEND_REPO}:latest"
        env:
          FRONTEND_REPO: ${{ steps.ecr.outputs.frontend_repo }}
          DEPLOY_TAG: ${{ github.ref_name }}

      - name: Generate SBOMs (Syft, non-blocking artifact)
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

          syft "${BACKEND_REPO}:${DEPLOY_TAG}" -o cyclonedx-json > backend-sbom.cdx.json
          syft "${FRONTEND_REPO}:${DEPLOY_TAG}" -o cyclonedx-json > frontend-sbom.cdx.json
        env:
          BACKEND_REPO: ${{ steps.ecr.outputs.backend_repo }}
          FRONTEND_REPO: ${{ steps.ecr.outputs.frontend_repo }}
          DEPLOY_TAG: ${{ github.ref_name }}

      - name: Upload SBOM artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: deploy-sboms-${{ github.ref_name }}
          path: |
            backend-sbom.cdx.json
            frontend-sbom.cdx.json
          retention-days: 90

      - name: Terraform apply infrastructure and services
        working-directory: terraform
        run: |
          set -euo pipefail
          terraform workspace select "${TF_WORKSPACE}"

          # The ALB security group blocks internet HTTP (port 80) unless
          # trusted ranges are supplied. Configure the repository variable
          # ALB_HTTP_INGRESS_CIDRS as a JSON list (e.g. ["203.0.113.0/24"])
          # while plaintext HTTP is still needed; 0.0.0.0/0 is rejected.
          if [[ -z "${ALB_HTTP_INGRESS_CIDRS}" ]]; then
            echo "::warning::ALB_HTTP_INGRESS_CIDRS is not set — internet HTTP (port 80) stays blocked; the app is only reachable over HTTPS."
            ALB_HTTP_INGRESS_CIDRS='[]'
          fi

          terraform apply -auto-approve \
            -var="aws_region=${AWS_REGION}" \
            -var="project_name=${PROJECT_NAME}" \
            -var="environment=${ENVIRONMENT}" \
            -var="backend_image=${BACKEND_REPO}:${DEPLOY_TAG}" \
            -var="frontend_image=${FRONTEND_REPO}:${DEPLOY_TAG}" \
            -var="alb_http_ingress_cidrs=${ALB_HTTP_INGRESS_CIDRS}"
        env:
          AWS_REGION: ${{ steps.config.outputs.aws_region }}
          PROJECT_NAME: ${{ steps.config.outputs.project_name }}
          ENVIRONMENT: ${{ steps.config.outputs.environment }}
          TF_WORKSPACE: ${{ steps.config.outputs.tf_workspace }}
          BACKEND_REPO: ${{ steps.ecr.outputs.backend_repo }}
          FRONTEND_REPO: ${{ steps.ecr.outputs.frontend_repo }}
          DEPLOY_TAG: ${{ github.ref_name }}
          ALB_HTTP_INGRESS_CIDRS: ${{ vars.ALB_HTTP_INGRESS_CIDRS }}

      - name: Post-apply smoke test
        working-directory: terraform
        run: |
          set -euo pipefail
          terraform workspace select "${TF_WORKSPACE}"
          APP_URL="$(terraform output -raw application_url)"

          echo "Probing ${APP_URL}/api/ready ..."
          for i in $(seq 1 30); do
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" "${APP_URL}/api/ready" || echo "000")
            echo "Attempt ${i}: HTTP ${STATUS}"
            if [ "${STATUS}" = "200" ]; then
              echo "Smoke test passed — backend is healthy behind the ALB."
              exit 0
            fi
            sleep 10
          done

          echo "::error::Smoke test failed — /api/ready did not return 200 within the timeout window."
          echo "::error::Rollback: re-run this workflow manually (workflow_dispatch) with rollback_to_tag set to the last known-good tag to redeploy its images."
          exit 1
        env:
          TF_WORKSPACE: ${{ steps.config.outputs.tf_workspace }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Rollback runbook: manually invoked via "Run workflow" (workflow_dispatch)
  # with rollback_to_tag set to a previously deployed tag. Redeploys that tag's
  # already-published, already-scanned images — it does not rebuild or rescan.
  #
  # Assumes the target tag's images are still present in ECR (the lifecycle
  # policy in terraform/ecr.tf retains the last 10 images per repository) and
  # mirrors the same bootstrap-then-apply Terraform sequence as the `deploy`
  # job above for consistency.
  # ─────────────────────────────────────────────────────────────────────────────
  rollback:
    name: Rollback — Redeploy Previous Tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Same approval gate as `deploy` — required reviewers for the `prod`
    # environment must be configured under Settings > Environments in the
    # repository (cannot be set from workflow YAML).
    environment:
      name: prod
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate rollback input
        run: |
          set -euo pipefail
          if [[ ! "${ROLLBACK_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::rollback_to_tag '${ROLLBACK_TAG}' does not look like a deploy tag (expected vX.Y.Z)."
            exit 1
          fi
        env:
          ROLLBACK_TAG: ${{ github.event.inputs.rollback_to_tag }}

      - name: Checkout code at rollback tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.rollback_to_tag }}

      - name: Resolve deploy configuration
        id: config
        run: |
          set -euo pipefail
          AWS_REGION="${AWS_REGION:-ap-southeast-2}"
          PROJECT_NAME="${PROJECT_NAME:-open-prompt-manager}"
          ENVIRONMENT="${ENVIRONMENT:-prod}"
          echo "aws_region=${AWS_REGION}" >> "$GITHUB_OUTPUT"
          echo "project_name=${PROJECT_NAME}" >> "$GITHUB_OUTPUT"
          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "tf_workspace=${PROJECT_NAME}-${ENVIRONMENT}-${AWS_REGION}" >> "$GITHUB_OUTPUT"
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ steps.config.outputs.aws_region }}
          role-session-name: github-actions-rollback

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.7.5'

      - name: Resolve AWS account ID
        id: aws-account
        run: |
          set -euo pipefail
          echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Bootstrap ECR repositories with Terraform
        id: ecr
        working-directory: terraform
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure
          terraform workspace select "${TF_WORKSPACE}" || terraform workspace new "${TF_WORKSPACE}"

          terraform apply -auto-approve \
            -target=aws_ecr_repository.backend \
            -target=aws_ecr_repository.frontend \
            -var="aws_region=${AWS_REGION}" \
            -var="project_name=${PROJECT_NAME}" \
            -var="environment=${ENVIRONMENT}"

          echo "backend_repo=$(terraform output -raw backend_ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "frontend_repo=$(terraform output -raw frontend_ecr_repository_url)" >> "$GITHUB_OUTPUT"
        env:
          AWS_REGION: ${{ steps.config.outputs.aws_region }}
          PROJECT_NAME: ${{ steps.config.outputs.project_name }}
          ENVIRONMENT: ${{ steps.config.outputs.environment }}
          TF_WORKSPACE: ${{ steps.config.outputs.tf_workspace }}

      - name: Verify rollback images exist in ECR
        run: |
          set -euo pipefail
          aws ecr describe-images --repository-name "${PROJECT_NAME}-backend" --image-ids imageTag="${ROLLBACK_TAG}" --region "${AWS_REGION}" >/dev/null
          aws ecr describe-images --repository-name "${PROJECT_NAME}-frontend" --image-ids imageTag="${ROLLBACK_TAG}" --region "${AWS_REGION}" >/dev/null
        env:
          PROJECT_NAME: ${{ steps.config.outputs.project_name }}
          AWS_REGION: ${{ steps.config.outputs.aws_region }}
          ROLLBACK_TAG: ${{ github.event.inputs.rollback_to_tag }}

      - name: Terraform apply infrastructure and services (rollback)
        working-directory: terraform
        run: |
          set -euo pipefail
          terraform workspace select "${TF_WORKSPACE}"

          if [[ -z "${ALB_HTTP_INGRESS_CIDRS}" ]]; then
            ALB_HTTP_INGRESS_CIDRS='[]'
          fi

          terraform apply -auto-approve \
            -var="aws_region=${AWS_REGION}" \
            -var="project_name=${PROJECT_NAME}" \
            -var="environment=${ENVIRONMENT}" \
            -var="backend_image=${BACKEND_REPO}:${ROLLBACK_TAG}" \
            -var="frontend_image=${FRONTEND_REPO}:${ROLLBACK_TAG}" \
            -var="alb_http_ingress_cidrs=${ALB_HTTP_INGRESS_CIDRS}"
        env:
          AWS_REGION: ${{ steps.config.outputs.aws_region }}
          PROJECT_NAME: ${{ steps.config.outputs.project_name }}
          ENVIRONMENT: ${{ steps.config.outputs.environment }}
          TF_WORKSPACE: ${{ steps.config.outputs.tf_workspace }}
          BACKEND_REPO: ${{ steps.ecr.outputs.backend_repo }}
          FRONTEND_REPO: ${{ steps.ecr.outputs.frontend_repo }}
          ROLLBACK_TAG: ${{ github.event.inputs.rollback_to_tag }}
          ALB_HTTP_INGRESS_CIDRS: ${{ vars.ALB_HTTP_INGRESS_CIDRS }}

      - name: Post-rollback smoke test
        working-directory: terraform
        run: |
          set -euo pipefail
          terraform workspace select "${TF_WORKSPACE}"
          APP_URL="$(terraform output -raw application_url)"

          echo "Probing ${APP_URL}/api/ready ..."
          for i in $(seq 1 30); do
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" "${APP_URL}/api/ready" || echo "000")
            echo "Attempt ${i}: HTTP ${STATUS}"
            if [ "${STATUS}" = "200" ]; then
              echo "Rollback smoke test passed — backend is healthy behind the ALB."
              exit 0
            fi
            sleep 10
          done

          echo "::error::Rollback smoke test failed — /api/ready did not return 200 within the timeout window. Manual intervention required."
          exit 1
        env:
          TF_WORKSPACE: ${{ steps.config.outputs.tf_workspace }}
