services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/prompts.db
      - CORS_ORIGINS=http://localhost,http://localhost:3000,http://localhost:80,vscode-file://vscode-app
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      # Fernet key used to encrypt LLM provider API keys at rest. Generate one with
      # `python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"`.
      # Only required once you configure a provider connection with an API key.
      - OPM_ENCRYPTION_KEY=${OPM_ENCRYPTION_KEY:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-e2e-admin@opm-test.io}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-200}
      - RATE_LIMIT_AUTH_PER_MINUTE=${RATE_LIMIT_AUTH_PER_MINUTE:-60}
      # Server-side feature flags. Unset by default, which resolves every
      # backend flag to false — the intended state for local development.
      - FLAGSMITH_SERVER_KEY=${FLAGSMITH_SERVER_KEY:-}
      - FLAGSMITH_API_URL=${FLAGSMITH_API_URL:-https://edge.api.flagsmith.com/api/v1/}
      - FLAGSMITH_REFRESH_INTERVAL_SECONDS=${FLAGSMITH_REFRESH_INTERVAL_SECONDS:-300}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the bundle at build time. Sourced from the repo-root .env.
        VITE_FLAGSMITH_ENVIRONMENT_ID: ${VITE_FLAGSMITH_ENVIRONMENT_ID:-}
        VITE_FLAGSMITH_API_URL: ${VITE_FLAGSMITH_API_URL:-https://edge.api.flagsmith.com/api/v1/}
    ports:
      - "80:80"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
    driver: local
