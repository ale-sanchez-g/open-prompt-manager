services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/prompts.db
      - CORS_ORIGINS=http://localhost,http://localhost:3000,http://localhost:80,vscode-file://vscode-app
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-e2e-admin@opm-test.io}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-200}
      - RATE_LIMIT_AUTH_PER_MINUTE=${RATE_LIMIT_AUTH_PER_MINUTE:-60}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # OpenTelemetry Collector sidecar — mirrors the ECS sidecar defined in
  # terraform/otel.tf so the local stack behaves the same as production.
  # Start with the 'otel' profile:
  #   docker-compose --profile otel up -d
  # or via:
  #   make up-otel
  #
  # Telemetry is logged to stdout (debug exporter) by default.
  # Send OTLP from the backend by setting:
  #   OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
  # The config is read from config/otel-collector-config.yaml which can be
  # edited without rebuilding any image.
  otel-collector:
    profiles: ["otel"]
    image: public.ecr.aws/aws-observability/aws-otel-collector:latest
    command: ["--config", "/etc/otel/config.yaml"]
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "13133:13133" # health check
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:13133"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  backend-data:
    driver: local
