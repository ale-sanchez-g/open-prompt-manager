title = "Open Prompt Manager gitleaks config"

[extend]
useDefault = true

# Reduce known false positives from generated assets while keeping source code strict.
[[allowlists]]
description = "Generated frontend coverage reports"
paths = [
  '''^frontend/coverage/.*$''',
]

[[allowlists]]
description = "Binary image assets"
paths = [
  '''^img/.*\.(png|jpg|jpeg|gif|webp)$''',
]

[[allowlists]]
description = "Playwright generated reports"
paths = [
  '''^e2e-test/playwright-report/.*$''',
  '''^e2e-test/test-results/.*$''',
]

[[allowlists]]
description = "Intentional secret examples in test-only source files"
paths = [
  '''^backend/tests/.*$''',
  '''^frontend/src/__tests__/.*$''',
  '''^e2e-test/specs/.*$''',
  '''^mcp-package-node/tests/.*$''',
  '''^terraform/tests/.*$''',
  '''^k6/.*$''',
]

[[allowlists]]
description = "Flagsmith client-side (publishable) Development environment key, used as a convenience default in the registration-rollout validation scripts - see docs/FEATURE_FLAGS.md and frontend/.env.example for why this key is not a secret"
regexes = [
  '''mGoGnmAiyNzxXCikjAo8Qd''',
]
